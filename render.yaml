# Render blueprint for the Echo API. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: echo-api
    runtime: python
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CHAT_PROVIDER
        value: gemini
      - key: MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: MODEL_SMART
        value: gemini-3.5-flash-lite
      - key: FALLBACK_PROVIDER
        value: groq
      - key: FALLBACK_MODEL
        value: openai/gpt-oss-120b
      - key: EMBED_PROVIDER
        value: gemini
      - key: EMBED_MODEL
        value: gemini-embedding-001
